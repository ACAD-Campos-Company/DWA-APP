<section class="challenges-panel">
  <header class="challenges-panel__header mb-2 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="fas fa-trophy"></i>
      <h3 class="font-family-poppins fw-semibold text-white">DESAFIOS</h3>
    </div>
    <p class="font-family-poppins fw-semibold mb-0" routerLink="/general/challenges" *ngIf="(challenges$ | async)!.length > 0">
      Ver todos
      <i class="fas fa-solid fa-caret-right"></i>
    </p>
  </header>

  <ng-container *ngIf="(challenges$ | async)!.length > 0 else noChallenges">
    <swiper-container
      class="challenges-panel__slider"
      [config]="swiperConfig"
      [slidesPerView]="1"
      style="--swiper-pagination-color: #ff4800"
      pagination="true"
      pagination-clickable="true"
      pagination-dynamic-bullets="true"
    >
      <swiper-slide *ngFor="let challenge of (challenges$ | async)!">
        <app-challenge-card
          [challenge]="challenge"
          [routerLink]="['/personal/challenge', challenge.id]"
        ></app-challenge-card>
      </swiper-slide>
    </swiper-container>
  </ng-container>

  <ng-template #noChallenges>
    <p class="text-white font-family-poppins">Nenhum desafio encontrado</p>
  </ng-template>
</section>
