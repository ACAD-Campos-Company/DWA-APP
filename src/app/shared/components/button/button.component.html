<button
  class="w-100 d-flex gap-2 justify-content-center align-items-center fw-bold font-family-poppins text-nowrap text-center"
  [ngClass]="[buttonClass || '']"
  (click)="onClick()"
  [disabled]="disabled"
>
  <span class="button-text">{{ label }}</span>
  <img *ngIf="icon" [src]="icon" alt="button icon" />
  <ng-content [icon]></ng-content>
</button>
