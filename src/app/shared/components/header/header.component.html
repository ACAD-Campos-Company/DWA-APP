<ng-container *ngIf="homeMode; else defaultHeader">
  <header
    class="d-flex align-items-center justify-content-between mb-3"
  >
    <div>
      <h1 class="text-white font-family-poppins fw-bold mb-1 fs-5">
        Oi, {{ currentUser.username }}!
      </h1>
      <p class="text-white fw-light fst-italic opacity-75 small mb-0" *ngIf="!isAdmin">
        Persistência hoje, resultados amanhã.
      </p>
      <p class="text-white fw-light fst-italic opacity-75 small mb-0" *ngIf="isAdmin">
        {{ currentUser.formatted_roles }}
      </p>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="position-relative">
        <i class="fas fa-bell fs-5 text-warning" routerLink="/notifications"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger small" *ngIf="currentCount > 0">
          {{ currentCount > 99 ? '99+' : currentCount }}
        </span>
      </div>
      <i class="fas fa-user fs-5 text-warning" routerLink="/menu"></i>
    </div>
  </header>
</ng-container>

<ng-template #defaultHeader>
  <header class="d-flex align-items-center flex-column w-100">
    <div class="d-flex w-100 justify-content-between align-items-center mb-2">
      <div class="d-flex align-items-center">
        <a
          (click)="goBack()"
          class="d-flex align-items-center justify-content-center rounded-circle bg-dark bg-opacity-10 me-3 text-decoration-none"
          style="width: 2rem; height: 2rem;"
          [routerLink]="routeNameBack ? routeNameBack : null"
        >
          <i class="fas fa-chevron-left fs-6 text-warning"></i>
        </a>
        <h1 class="font-family-league-spartan mb-0 fs-4 fw-bold text-white">{{ title }}</h1>
      </div>
      <i *ngIf="hasHome" [routerLink]="routeName" class="fa-solid fa-house fs-5 text-warning"></i>
    </div>
  </header>
</ng-template>
