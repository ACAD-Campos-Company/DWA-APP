<app-header title="Notificações"></app-header>

<div class="notifications-container">
  <div class="notification-tabs mb-4">
    <button 
      class="tab-button button-left" 
      [class.active]="activeTab === 'read'"
      (click)="setActiveTab('read')"
    >
      Lidas
    </button>
    <button 
      class="tab-button button-right" 
      [class.active]="activeTab === 'unread'"
      (click)="setActiveTab('unread')"
    >
      Não lidas
    </button>
  </div>

  <div class="notifications-section" *ngIf="activeTab === 'unread'">
    <div class="section-header d-flex justify-content-between align-items-center mb-3">
      <h3 class="section-title text-white fw-semibold">Não lidas</h3>
      <button 
        class="btn btn-outline-light d-flex align-items-center gap-2" 
        (click)="markAllAsRead()" 
        [disabled]="(unreadNotifications$ | async)?.length === 0 || (isMarkingAll$ | async)"
      >
        <i class="bi bi-check2-all"></i>
        <span *ngIf="!(isMarkingAll$ | async)">Marcar todas como lidas</span>
        <span *ngIf="isMarkingAll$ | async">Marcando...</span>
      </button>
    </div>
    <ng-container *ngIf="unreadNotifications$ | async">
      <app-notification-card
        *ngFor="let notification of unreadNotifications$ | async"
        [title]="notification.title"
        [body]="notification.body"
        [read]="false"
        [imageUrl]="notification.image"
        [type]="notification.type"
        [timestamp]="notification.timestamp"
        (onClose)="$event.stopPropagation(); markAsRead(notification.id)"
        (click)="handleNotificationClick(notification)"
      >
      </app-notification-card>
    </ng-container>
    <div
      *ngIf="(unreadNotifications$ | async)!.length === 0"
      class="empty-section"
    >
      <p class="text-white">Sem notificações não lidas</p>
    </div>
  </div>

  <div class="notifications-section" *ngIf="activeTab === 'read'">
    <h3 class="section-title mb-3 text-white fw-semibold">Lidas</h3>
    <ng-container *ngIf="readNotifications$ | async">
      <app-notification-card
        *ngFor="let notification of readNotifications$ | async"
        [title]="notification.title"
        [body]="notification.body"
        [read]="true"
        [imageUrl]="notification.image"
        [type]="notification.type"
        [timestamp]="notification.timestamp"
        (click)="handleNotificationClick(notification)"
      >
      </app-notification-card>
    </ng-container>
    <div
      *ngIf="(readNotifications$ | async)!.length === 0"
      class="empty-section"
    >
      <p class="text-white">Sem notificações lidas</p>
    </div>
  </div>
</div>
