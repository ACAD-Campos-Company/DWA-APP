<div class="notification-card" [class.read]="read" (click)="handleClick($event)">
  <div class="notification-content">
    <div class="notification-image" *ngIf="imageUrl">
      <img [src]="imageUrl" [alt]="title" class="img-fluid">
    </div>
    <div class="notification-details">
      <div class="notification-header d-flex justify-content-between align-items-start">
        <h3 class="fw-semibold mb-2">{{ title }}</h3>
        <button *ngIf="!read" class="read-btn" (click)="handleClose($event)">
          Ler
        </button>
      </div>
      <p class="notification-body mb-0">{{ body }}</p>
    </div>
  </div>
  <div class="notification-footer">
    <span class="notification-type" *ngIf="type">{{ type }}</span>
    <span class="notification-time">{{ timestamp | date:'dd/MM/yyyy HH:mm' }}</span>
  </div>
</div>
