<app-header title="Aluno" [hasHome]="true"></app-header>

<div class="member-view-container container-fluid p-0">
  <div class="member-card bg-white rounded-4 shadow-sm mb-4" *ngIf="member$ | async as member">
    <div class="d-flex w-100 overflow-hidden">
      <div class="member-image">
        <img
          [src]="'assets/images/default-user-profile.png'"
          [alt]="member.username"
          class="img-fluid rounded-start-4"
        />
      </div>
      <div class="member-info p-3">
        <h2 class="mb-3 font-family-poppins">{{ member.first_name }} {{ member.last_name }}</h2>
        <div class="d-flex flex-column gap-2">
          <p class="mb-0 d-flex align-items-center gap-2 font-family-poppins">
            <i class="fas fa-phone text-warning"></i>
            <span>{{ member.telephone || 'Não informado' }}</span>
          </p>
          <p class="mb-0 d-flex align-items-center gap-2 font-family-poppins">
            <i class="fas fa-envelope text-warning"></i>
            <span class="text-truncate">{{ member.email || 'Não informado' }}</span>
          </p>
        </div>
      </div>
    </div>
  </div>

  <h3 class="mt-4 mb-3 font-family-poppins text-white">Treinos Cadastrados</h3>
  <ng-container *ngIf="trainings$ | async as trainings">
    <div class="trainings-container d-flex flex-column gap-4">
      <ng-container *ngIf="trainings.length > 0; else noTrainings">
        <app-card
          *ngFor="let training of trainings"
          [title]="training.name.toLocaleUpperCase() || 'Treino'"
          [duration]="getDuration(training)"
          imageSrc="assets/images/default-training-profile.png"
          size="large"
          [routerLink]="[
            '/general/training',
            training.origin_trainingID || training.id
          ]"
          [showButton]="true"
        ></app-card>
      </ng-container>
    </div>
  </ng-container>

  <ng-template #noTrainings>
    <p class="text-white">Nenhum treino cadastrado para este aluno.</p>
  </ng-template>
</div>
